<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <link
    href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
    rel="stylesheet"
  >
  </link>
  <link
    rel="stylesheet"
    href="style.css"
    media="screen"
    charset="utf-8"
  >
  </link>
</head>
<body>
  <header class="centered-head-page-element">
    <article>
      <img src="./eisenhower-matrix.jpg" alt="Martix">
    </article>
    <article>
      <a
        class="info"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </article>
  </header>
  <main class="centered-main-page-element">
    <section>
      <p id="topSectionForAddingElementToList">
        <label for="new-task">
          Add Item
        </label>
        <div class="task-row-wrapper">
          <input
            id="new-task"
            class="task"
            type="text"
          >
          </input>
          <button>
            Add
          </button>
        </div>
      </p>
    </section>
    <section>
      <h3>Todo</h3>
      <ul id="incompleteTasks">
        <article>
          <li>
            <input type="checkbox">
            <label class="task">
              Pay Bills
            </label>
            <input
              type="text"
              class="task"
            >
            </input>
            <button class="edit">
              Edit
            </button>
            <button class="delete">
              <img src="./remove.svg" alt="Remove">
            </button>
          </li>
        </article>
        <article>
          <li class="edit-mode">
            <input type="checkbox">
            <label class="task">
              Go Shopping
            </label>
            <input
              type="text"
              value="Go Shopping"
              class="task"
            >
            </input>
            <button class="edit">
              Save
            </button>
            <button class="delete">
              <img src="./remove.svg" alt="Remove">
            </button>
          </li>
        </article>
      </ul>
    </section>
    <section>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <article>
          <li>
            <input type="checkbox" checked>
            <label class="task">
              See the Doctor
            </label>
            <input
              type="text"
              class="task"
            >
            </input>
            <button class="edit">
              Edit
            </button>
            <button class="delete">
              <img src="./remove.svg" alt="Remove">
            </button>
          </li>
        </article>
      </ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
